name: frames

on:
  workflow_dispatch:

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch clips
        run: |
          mkdir -p clips out
          gh release download v1 --repo "${{ github.repository }}" --dir clips --pattern "*.mp4"
          ls -l clips
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Probe
        run: |
          for f in clips/*.mp4; do
            echo "== $f"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height,nb_frames,r_frame_rate \
              -show_entries format=duration -of default=nw=1 "$f"
          done | tee out/probe.txt

      - name: Contact sheets
        run: |
          for f in clips/*.mp4; do
            b=$(basename "$f" .mp4)
            # Nine evenly spaced frames across the moving part of the clip.
            ffmpeg -nostdin -y -loglevel error -i "$f" \
              -vf "fps=1/3,scale=360:-1,tile=3x3" -frames:v 1 "out/$b-sheet.png"
            # A tight crop on the puck, enlarged, to judge the head itself.
            ffmpeg -nostdin -y -loglevel error -ss 12 -i "$f" -frames:v 1 \
              -vf "crop=200:200:260:540,scale=600:600:flags=neighbor" "out/$b-head.png"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: out/*
