name: frames

on:
  workflow_dispatch:

jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Download clips
        run: |
          set -e
          mkdir -p clips out
          gh release download v1 --repo "${{ github.repository }}" --dir clips --pattern "*.mp4"
          ls -l clips
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Probe
        run: |
          set -e
          for f in clips/*.mp4; do
            echo "== $f" | tee -a out/probe.txt
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f" | tee -a out/probe.txt
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | tee -a out/probe.txt
          done

      - name: Stills
        run: |
          for f in clips/*.mp4; do
            b=$(basename "$f" .mp4)
            for t in 6 14 22 28; do
              ffmpeg -nostdin -y -loglevel error -ss "$t" -i "$f" -frames:v 1 "out/$b-t$t.png" || echo "fail $b $t"
            done
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheets
          path: out/
